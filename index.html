          <div class="chat-tools"><button class="tool-button" id="calendarHeader" title="캘린더 보기" aria-label="캘린더 보기"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button><button class="tool-button optional" id="groupHeader" title="모둠 편성" aria-label="모둠 편성"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"/></svg></button><button class="tool-button optional" id="historyButton" title="대화 기록 안내" aria-label="대화 기록 안내"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></div>

<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><h2 id="modalTitle"></h2><button class="close-button" id="modalClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><form id="modalForm"></form></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = (selector) => document.querySelector(selector);
const storageKey = 'dajung-classroom-v1';
const palette = ['','coral','lilac','blue','yellow'];
const initialData = {
  role:'teacher', className:'5학년 2반', studentId:'s1', studentName:'김하늘', selectedId:'s1',
  students:[
    {id:'s1',name:'김하늘',color:0},{id:'s2',name:'이도윤',color:1},{id:'s3',name:'박민서',color:2},{id:'s4',name:'최유진',color:3},{id:'s5',name:'정시우',color:4},{id:'s6',name:'윤서아',color:2}
  ],
  groups:[{id:'g1',name:'별빛 모둠',members:['s1','s3','s5']},{id:'g2',name:'무지개 모둠',members:['s2','s4','s6']}],
  events:[
    {id:'e1',date:'2026-10-20',title:'과학 준비물 가져오기',detail:'돋보기와 관찰 노트를 챙겨 와요.',readBy:['s1','s2','s4']},
    {id:'e2',date:'2026-10-22',title:'책 읽는 날',detail:'함께 읽고 싶은 책 한 권을 가져와요.',readBy:['s1','s3','s5']},
    {id:'e3',date:'2026-10-26',title:'학급 발표회',detail:'모둠별 발표 순서를 확인해 주세요.',readBy:['s2']}
  ],
  announcements:[
    {id:'a1',title:'수학 학습지 제출 안내',content:'이번 주에 푼 학습지를 확인하고 제출해 주세요.',postedAt:'2026-10-17T08:30:00.000Z',deadlineAt:'2026-10-20'},
    {id:'a2',title:'도서관 책 반납 안내',content:'빌린 책을 도서관 반납함에 넣어 주세요.',postedAt:'2026-10-16T03:00:00.000Z',deadlineAt:''},
    {id:'a3',title:'아침 독서 준비',content:'읽고 싶은 책 한 권을 교실에 가져와 주세요.',postedAt:'2026-10-15T23:00:00.000Z',deadlineAt:'2026-10-21'}
  ],
  chats:{
    s1:[{from:'teacher',text:'하늘아, 오늘 발표 준비하느라 수고했어요! 궁금한 점 있으면 편하게 남겨 주세요.',time:'오전 9:18'},{from:'student',text:'감사합니다 선생님! 그림 자료는 내일 가져가도 될까요?',time:'오전 9:26'},{from:'teacher',text:'네, 내일까지 준비하면 충분해요. 친구들과 역할도 나눠 보세요 :)',time:'오전 9:30'}],
    s2:[{from:'teacher',text:'도윤아, 수학 문제 4번 풀이를 같이 확인해 봐요.',time:'오전 10:04'},{from:'student',text:'제가 계산한 방법을 사진 대신 글로 적어볼게요.',time:'오전 10:12'}],
    s3:[{from:'student',text:'민서야, 모둠 발표 제목은 어떤 게 좋을까?',time:'어제'}],
    s4:[{from:'teacher',text:'유진아, 준비물 안내를 확인해 주세요.',time:'어제'}],
    s5:[],s6:[],
    g1:[{from:'teacher',text:'별빛 모둠 친구들, 오늘은 발표 주제를 정하고 각자 맡을 일을 이야기해 봐요.',time:'오전 9:05'},{from:'s3',text:'저는 사진 자료를 찾아볼게요!',time:'오전 9:12'}],
    g2:[{from:'teacher',text:'무지개 모둠, 함께 정한 규칙을 발표 자료에 넣어 주세요.',time:'오전 8:50'}],
    'peer-s1-s3':[{from:'s3',text:'하늘아, 우리 발표 제목 같이 생각해 볼래?',time:'오전 9:42'}]
  }, unread:{s1:1,s3:1},
  peerNames:{'peer-s1-s3':'박민서'}
};
let data;
let openThread=null;
let sidebarMode='chats';
try{data=JSON.parse(localStorage.getItem(storageKey))||initialData}catch{data=initialData}
data.announcements ||= initialData.announcements;
data.chatThreads ||= {};
Object.entries(data.chats||{}).forEach(([chatId,messages])=>{if(!data.chatThreads[chatId])data.chatThreads[chatId]=[{id:`main-${chatId}`,title:'기존 대화',messages:Array.isArray(messages)?messages:[],createdAt:0,updatedAt:0}]});
const classPresets={
  '5학년 1반':{students:[{id:'a1',name:'강지우',color:0},{id:'a2',name:'문서준',color:1},{id:'a3',name:'배수아',color:2},{id:'a4',name:'신도현',color:3},{id:'a5',name:'오하린',color:4}],groups:[{id:'g51a',name:'햇살 모둠',members:['a1','a3','a5']},{id:'g51b',name:'구름 모둠',members:['a2','a4']}]},
  '4학년 3반':{students:[{id:'b1',name:'고은찬',color:0},{id:'b2',name:'김나율',color:1},{id:'b3',name:'남예준',color:2},{id:'b4',name:'도하윤',color:3},{id:'b5',name:'유채원',color:4}],groups:[{id:'g43a',name:'초록 모둠',members:['b1','b2','b3']},{id:'g43b',name:'바다 모둠',members:['b4','b5']}]}
};
data.classrooms ||= {};
const demoReadStatus={e1:['s1','s2','s4'],e2:['s1','s3','s5'],e3:['s2']};
data.events.forEach(event=>{if(!Array.isArray(event.readBy)||(!event.readBy.length&&demoReadStatus[event.id]))event.readBy=demoReadStatus[event.id]||[]});
function save(){localStorage.setItem(storageKey,JSON.stringify(data))}
save();
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function student(id){return data.students.find(p=>p.id===id)}
if(!student(data.studentId))data.studentId=data.students[0]?.id||'';
if(student(data.studentId))data.studentName=student(data.studentId).name;
function currentStudentId(){return data.students.some(p=>p.id===data.studentId)?data.studentId:(data.students[0]?.id||'s1')}
function group(id){return data.groups.find(p=>p.id===id)}
function currentStudentGroups(){return data.groups.filter(g=>g.members.includes(currentStudentId()))}
function studentCanOpenConversation(id){return id==='teacher'||(isGroup(id)&&currentStudentGroups().some(g=>g.id===id))}
function isGroup(id){return id.startsWith('g')}
function selectedPeerChat(id){return id.startsWith('peer-')}
function initials(name){return (name||'?').slice(0,1)}
function avatar(name,color=0,extra=''){return `<span class="person-avatar ${palette[color]||''} ${extra}">${esc(initials(name))}</span>`}
function getChatName(id){if(id==='teacher')return '박서연 선생님';if(isGroup(id))return group(id)?.name||'모둠';if(selectedPeerChat(id))return data.peerNames[id]||'친구';return student(id)?.name||'학생'}
function getChatThreads(id){if(!data.chatThreads[id])data.chatThreads[id]=[{id:`main-${id}`,title:'기존 대화',messages:data.chats[id]||[],createdAt:0,updatedAt:0}];return data.chatThreads[id]}
function getLatestThread(id){return [...getChatThreads(id)].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))[0]}
function getLast(id){const thread=getLatestThread(id),message=thread?.messages?.at(-1);return message?.text||(thread?`새 대화: ${thread.title}`:'새로운 대화를 시작해 보세요')}
function getTime(id){const thread=getLatestThread(id);return thread?.messages?.at(-1)?.time||''}
function setRole(role){data.role=role;openThread=null;if(role==='student'){data.studentId=currentStudentId();data.studentName=student(data.studentId)?.name||data.studentName;data.selectedId='teacher'}else if(data.selectedId==='teacher'||selectedPeerChat(data.selectedId))data.selectedId=data.students[0]?.id||'';save();render()}
function render(){
  const teacher=data.role==='teacher';
  $('#teacherRole').classList.toggle('active',teacher);$('#studentRole').classList.toggle('active',!teacher);
  $('#chatNav').classList.toggle('selected',sidebarMode==='chats');$('#announcementNav').classList.toggle('selected',sidebarMode==='announcements');
  $('#roleName').textContent=teacher?'박서연 선생님':data.studentName;$('#headerAvatar').textContent=teacher?'서':initials(data.studentName);
  $('#classEyebrow').textContent=teacher?'MY CLASSROOM':'MY CLASS';$('#privacyFooter').textContent=teacher?'안전한 학급 소통 공간':'대화는 선생님이 확인할 수 있어요';
  $('#classPicker').value=data.className;$('#classPicker').disabled=!teacher;
  $('#addGroupButton').style.display=teacher&&sidebarMode==='chats'?'grid':'none';$('#addAnnouncementButton').style.display=teacher&&sidebarMode==='announcements'?'grid':'none';$('#groupCreateShortcut').style.display=teacher?'grid':'none';
  renderContacts();renderChat();renderCalendar();
}
function renderContacts(){
  if(sidebarMode==='announcements'){renderAnnouncementList();return}
  $('#listLabel').textContent='대화 상대';
  const teacher=data.role==='teacher';let peopleRows=[],groupRows=[];
  if(teacher){
    peopleRows=data.students.map(p=>({id:p.id,name:p.name,avatar:avatar(p.name,p.color),tag:'',preview:getLast(p.id)}));
    groupRows=data.groups.map(g=>({id:g.id,name:g.name,avatar:`<span class="avatar-stack">${g.members.slice(0,2).map(id=>avatar(student(id)?.name,student(id)?.color,'small')).join('')}</span>`,tag:'모둠',preview:getLast(g.id)}));
  }else{
    const myId=currentStudentId();
    peopleRows=[{id:'teacher',name:'박서연 선생님',avatar:avatar('서',1),tag:'교사',preview:getLast(myId)}];
    const myGroups=currentStudentGroups();
    groupRows=myGroups.map(g=>({id:g.id,name:g.name,avatar:`<span class="avatar-stack">${g.members.slice(0,2).map(id=>avatar(student(id)?.name,student(id)?.color,'small')).join('')}</span>`,tag:'',preview:getLast(g.id)}));
    if(!studentCanOpenConversation(data.selectedId))data.selectedId='teacher';
    save();
  }
  const renderRows=rows=>rows.length?rows.map(row=>`<button class="contact ${data.selectedId===row.id?'active':''}" data-contact="${esc(row.id)}" type="button">${row.avatar}<span class="contact-copy"><span class="contact-name">${esc(row.name)}${row.tag?`<span class="group-tag">${row.tag}</span>`:''}</span><span class="contact-preview">${esc(row.preview)}</span></span>${data.unread?.[row.id]?`<span class="unread">${data.unread[row.id]}</span>`:`<span class="contact-time">${esc(getTime(row.id))}</span>`}</button>`).join(''):'<div class="empty-state">아직 대화가 없어요.</div>';
  const section=(title,rows,pinned=false)=>`<section class="contact-section${pinned?' pinned':''}"><div class="contact-section-title">${title}<span class="section-count">${rows.length}</span></div>${renderRows(rows)}</section>`;
  $('#contactList').innerHTML=teacher?`${section('학생 대화',peopleRows)}${section('모둠 대화',groupRows)}`:`${section('모둠 대화',groupRows,true)}${section('선생님 대화',peopleRows)}`;
  $('#contactList').querySelectorAll('[data-contact]').forEach(btn=>btn.addEventListener('click',()=>{sidebarMode='chats';data.selectedId=btn.dataset.contact;openThread=null;delete data.unread[data.selectedId];save();$('#shell').classList.add('chat-open');render()}));
}
function renderAnnouncementList(){
  $('#listLabel').textContent='공지사항';
  const announcements=[...data.announcements].sort((a,b)=>new Date(b.postedAt)-new Date(a.postedAt)).slice(0,3);
  $('#contactList').innerHTML=announcements.length?`<div class="announcement-list">${announcements.map(item=>`<button class="announcement-list-item" data-announcement="${esc(item.id)}" type="button"><span class="announcement-list-meta"><span>${formatPostedDate(item.postedAt)}</span>${item.deadlineAt?'<span class="deadline-pill">마감 확인</span>':''}</span><span class="announcement-list-title">${esc(item.title)}</span><span class="announcement-list-preview">${esc(item.content)}</span></button>`).join('')}</div><div class="announcement-list-empty">최신 공지 최대 3개를 게시일 순으로 보여드려요.</div>`:'<div class="announcement-list-empty">등록된 공지사항이 없어요.</div>';
  $('#contactList').querySelectorAll('[data-announcement]').forEach(button=>button.addEventListener('click',()=>openAnnouncementDetail(button.dataset.announcement)));
}
function renderChat(){
  let id=data.selectedId|| (data.role==='teacher'?data.students[0]?.id:'teacher');if(data.role==='student'&&!studentCanOpenConversation(id))id='teacher';data.selectedId=id;
  const teacher=data.role==='teacher';let title=getChatName(id),subtitle='';
  if(teacher){subtitle=isGroup(id)?`${group(id)?.members.length||0}명의 모둠 대화`:'학생과 주고받은 대화';}
  else subtitle=isGroup(id)?`${group(id)?.members.length||0}명의 모둠 친구`:'선생님과 나눈 대화';
  $('#chatAvatar').innerHTML=isGroup(id)?`<span class="person-avatar group-symbol">${esc(initials(title))}</span>`:avatar(id==='teacher'?'서':(student(id)?.name||getChatName(id)),id==='teacher'?1:(student(id)?.color||0));
  $('#chatTitle').textContent=title;$('#chatSubtitle').textContent=subtitle;
  const chatId=teacher?id:(selectedPeerChat(id)?id:(id==='teacher'?currentStudentId():id));
  const threads=getChatThreads(chatId),activeThread=threads.find(thread=>openThread?.chatId===id&&thread.id===openThread.threadId),threadOpen=Boolean(activeThread),messages=activeThread?.messages||[];
  if(threadOpen){
    const notice=teacher?'학생과 나눈 대화는 기록되어 언제든 확인할 수 있어요.':'안내: 선생님은 학생과 주고받은 대화 내용을 확인할 수 있어요.';
    $('#messages').innerHTML=`<div class="date-divider">오늘</div><div class="notice">${teacher?'<svg style="width:12px;height:12px;vertical-align:-2px;margin-right:3px" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>':''}<strong>${teacher?'대화 기록 안내':'대화 안내'}</strong> · ${notice}</div>${messages.map(m=>renderMessage(m,teacher,id)).join('')||`<div class="empty-state">아직 대화가 없어요.<br>메시지를 보내 대화를 시작해 보세요.</div>`}`;
  }else{
    const sortedThreads=[...threads].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
    const cards=sortedThreads.map(thread=>{const latest=thread.messages?.at(-1),preview=latest?.text||'아직 대화가 없어요. 눌러서 대화를 시작해 보세요.';return `<button class="thread-card" data-open-thread="${esc(thread.id)}" type="button"><span class="thread-card-icon"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"/><path d="M8 10h8M8 14h5"/></svg></span><span class="thread-card-copy"><span class="thread-card-title">${esc(thread.title)}</span><span class="thread-card-preview">${esc(preview)}</span><span class="thread-card-meta">메시지 ${thread.messages?.length||0}개${latest?.time?` · 최근 ${esc(latest.time)}`:''}</span></span><svg class="thread-card-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>`}).join('');
    const createButton=isGroup(id)?(data.role==='student'?'<button class="thread-new-button" id="newGroupThread" type="button">+ 새 대화</button>':''):'<button class="thread-new-button" id="newPrivateThread" type="button">+ 새 대화</button>';
    $('#messages').innerHTML=`<div class="thread-list-view"><div class="thread-list-heading"><p class="eyebrow">${isGroup(id)?'GROUP THREAD':'MESSAGE THREAD'}</p><div class="thread-heading-row"><h2>대화 스레드</h2>${createButton}</div><p>목록을 선택하면 실제 대화 내용을 볼 수 있어요.</p></div><div class="thread-card-list">${cards}</div></div>`;
    $('#messages').querySelectorAll('[data-open-thread]').forEach(button=>button.addEventListener('click',()=>{openThread={chatId:id,threadId:button.dataset.openThread};renderChat()}));
    $('#newGroupThread')?.addEventListener('click',openNewGroupThread);
    $('#newPrivateThread')?.addEventListener('click',openNewPrivateThread);
  }
  $('#threadListBack').style.display=threadOpen?'grid':'none';$('#composerWrap').style.display=threadOpen?'':'none';
  $('#messages').scrollTop=$('#messages').scrollHeight;
  $('#messageInput').placeholder=isGroup(id)?`${title} 친구들에게 메시지 보내기`:`${title}에게 메시지 보내기`;
  $('#composeHint').textContent=teacher?'Enter로 전송 · 이 대화는 기록됩니다':'Enter로 전송 · 선생님이 대화를 확인할 수 있어요';
  $('#historyButton').title=teacher?'학생과 나눈 대화는 기록되어 확인할 수 있어요':'선생님은 이 대화 내용을 확인할 수 있어요';
}
function renderMessage(m,teacher,chatId){
  const mine=teacher?m.from==='teacher':(m.from==='student'||m.from===currentStudentId()||m.from==='me');
  let sender='';if(isGroup(chatId)&&!mine)sender=m.from==='teacher'?'박서연 선생님':(student(m.from)?.name||data.peerNames[chatId]||'친구');
  const color=student(m.from)?.color||1;
  return `<div class="message-row ${mine?'mine':''}">${!mine&&isGroup(chatId)?avatar(sender,color,'small'):''}<div class="bubble-wrap">${sender?`<div class="sender">${esc(sender)}</div>`:''}<div class="bubble">${esc(m.text)}</div><div class="message-meta">${esc(m.time||'방금')} ${mine&&teacher?'<span class="read-mark">✓✓</span>':''}</div></div></div>`;
}
const monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];let shownMonth=new Date(2026,9,1);
function renderCalendar(){
  const y=shownMonth.getFullYear(),m=shownMonth.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
  const cells=[];for(let i=0;i<42;i++){let day=i-offset+1,other=false,dt;if(day<1){day=prevDays+day;other=true;dt=new Date(y,m-1,day)}else if(day>days){day-=days;other=true;dt=new Date(y,m+1,day)}else dt=new Date(y,m,day);const iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;const today=iso==='2026-10-18';const event=data.events.some(e=>e.date===iso);cells.push(`<button class="day ${other?'other':''} ${today?'today':''} ${event?'event':''}" data-day="${iso}" type="button" aria-label="${iso}${event?', 일정 있음':''}">${day}</button>`)}
  const month=`${y}-${String(m+1).padStart(2,'0')}`;const events=data.events.filter(e=>e.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
  $('#calendarInner').innerHTML=`<div class="calendar-heading"><h2>학급 캘린더</h2><button id="calendarClose" class="icon-button" aria-label="캘린더 닫기"><svg viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><div class="month-row"><strong>${y}년 ${monthNames[m]}</strong><div class="month-controls"><button id="prevMonth" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button id="nextMonth" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div></div><div class="weekdays"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div class="calendar-grid">${cells.join('')}</div><hr class="calendar-rule"><div class="events-title"><span>이번 달 공지</span>${data.role==='teacher'?'<button id="addEventButton">+ 일정 추가</button>':''}</div>${events.length?events.map(e=>{const count=(e.readBy||[]).filter(id=>data.students.some(p=>p.id===id)).length;const status=data.role==='teacher'?`${count}/${data.students.length}명 확인`:((e.readBy||[]).includes(currentStudentId())?'확인 완료':'눌러서 내용 확인');return `<button class="event-card" data-event="${esc(e.id)}" type="button"><div class="event-date"><span class="event-dot"></span>${formatDate(e.date)}</div><div class="event-name">${esc(e.title)}</div><div class="event-by">${esc(e.detail)}</div><div class="event-card-status ${data.role==='student'&&!(e.readBy||[]).includes(currentStudentId())?'pending':''}">${status}</div></button>`}).join(''):'<div class="empty-state">이번 달 등록된 공지가 없어요.</div>'}`;
  $('#calendarInner').querySelectorAll('[data-event]').forEach(button=>button.addEventListener('click',()=>openEventDetail(button.dataset.event)));
  $('#calendarClose').addEventListener('click',toggleCalendar);$('#prevMonth').addEventListener('click',()=>{shownMonth=new Date(y,m-1,1);renderCalendar()});$('#nextMonth').addEventListener('click',()=>{shownMonth=new Date(y,m+1,1);renderCalendar()});$('#addEventButton')?.addEventListener('click',openEventModal);
}
function openEventDetail(eventId){
  const event=data.events.find(item=>item.id===eventId);if(!event)return;
  event.readBy ||= [];
  if(data.role==='student'&&!event.readBy.includes(currentStudentId())){event.readBy.push(currentStudentId());save();renderCalendar()}
  const readIds=new Set(event.readBy),readCount=data.students.filter(person=>readIds.has(person.id)).length;
  const detail=`<article class="announcement-detail"><div class="announcement-date">${formatDate(event.date)}</div><h3>${esc(event.title)}</h3><p>${esc(event.detail||'공지 내용이 없습니다.')}</p>${data.role==='student'?'<div class="student-opened">✓ 이 공지를 확인했어요</div>':''}</article>`;
  if(data.role==='student'){openModal('학급 공지',`${detail}<div class="modal-actions"><button type="button" data-cancel>닫기</button></div>`,()=>{});$('#modalForm [data-cancel]').addEventListener('click',closeModal);return}
  const cells=data.students.map(person=>{const read=readIds.has(person.id);return `<div class="read-cell ${read?'is-read':''}" aria-label="${esc(person.name)} ${read?'확인함':'미확인'}"><div class="heat-square">${esc(initials(person.name))}</div><span class="read-cell-name">${esc(person.name)}</span><span class="read-cell-state">${read?'확인함':'미확인'}</span></div>`}).join('');
  const percent=data.students.length?Math.round(readCount/data.students.length*100):0;
  openModal('공지 확인 현황',`${detail}<div class="heatmap-summary"><div class="heatmap-count"><strong>${readCount} / ${data.students.length}</strong><span>명이 공지를 확인했어요</span></div><div class="heatmap-progress"><span style="width:${percent}%"></span></div></div><div class="read-grid">${cells||'<div class="empty-state">학생이 없어요.</div>'}</div><div class="heatmap-legend"><span><i class="legend-square read"></i>확인함</span><span><i class="legend-square"></i>미확인</span></div><div class="modal-actions"><button type="button" data-cancel>닫기</button></div>`,()=>{});
  $('#modalForm [data-cancel]').addEventListener('click',closeModal);
}
function formatDate(iso){const [y,m,d]=iso.split('-').map(Number);return `${m}월 ${d}일`}
function formatPostedDate(timestamp){return new Date(timestamp).toLocaleDateString('ko-KR',{month:'long',day:'numeric'})}
function toggleCalendar(){const drawer=$('#calendarDrawer'),shell=$('#shell');if(innerWidth<=720&&!shell.classList.contains('chat-open')){shell.classList.add('chat-open');drawer.classList.add('open')}else drawer.classList.toggle('open');$('#calendarToggle').classList.toggle('selected',drawer.classList.contains('open'))}
function sendMessage(text){
  const id=data.selectedId,teacher=data.role==='teacher';const chatId=teacher?id:(isGroup(id)?id:(id==='teacher'?currentStudentId():id));
  if(!text.trim())return;const thread=openThread?.chatId===id?getChatThreads(chatId).find(item=>item.id===openThread.threadId):null;if(!thread){notify('먼저 대화 스레드를 열어 주세요.');return}
  thread.messages ||= [];thread.messages.push({from:teacher?'teacher':currentStudentId(),text:text.trim(),time:new Intl.DateTimeFormat('ko-KR',{hour:'numeric',minute:'2-digit'}).format(new Date())});thread.updatedAt=Date.now();
  if(teacher&&!isGroup(id))data.unread[id]=(data.unread[id]||0)+1;
  $('#messageInput').value='';save();render();$('#messageInput').focus();notify(teacher?'메시지를 보냈어요.':'메시지를 보냈어요.');
}
function notify(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
function openModal(title,body,onSubmit){$('#modalTitle').textContent=title;$('#modalForm').innerHTML=body;$('#modalBackdrop').classList.add('open');$('#modalForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget));};$('#modalForm').querySelector('input,textarea')?.focus()}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function openGroupModal(){
  const checks=data.students.map(p=>`<label class="student-check"><input type="checkbox" name="members" value="${esc(p.id)}">${esc(p.name)}</label>`).join('');
  openModal('새 모둠 만들기',`<div class="form-field"><label for="groupName">모둠 이름</label><input id="groupName" name="name" required placeholder="예: 햇살 모둠" maxlength="20"></div><div class="form-field"><label>모둠에 넣을 학생을 선택해 주세요</label><div class="student-checks">${checks}</div></div><div class="modal-actions"><button type="button" data-cancel>취소</button><button class="primary" type="submit">모둠 만들기</button></div>`,form=>{const name=String(form.get('name')||'').trim(),members=form.getAll('members');if(!name){return}if(!members.length){notify('학생을 한 명 이상 선택해 주세요.');return}const id=`g${Date.now()}`;data.groups.push({id,name,members});data.chats[id]=[];data.selectedId=id;save();closeModal();render();notify(`${name}을(를) 만들었어요.`)});
  $('#modalForm [data-cancel]').addEventListener('click',closeModal);
}
function openNewGroupThread(){
  const chatId=data.selectedId,selectedGroup=group(chatId);
  if(data.role!=='student'||!selectedGroup||!studentCanOpenConversation(chatId))return;
  const memberNames=selectedGroup.members.map(id=>student(id)?.name).filter(Boolean).join(' · ');
  openModal('새 모둠 대화',`<p class="modal-intro">${esc(selectedGroup.name)} 구성원과 함께하는 단체 스레드예요.<br>${esc(memberNames)}</p><div class="form-field"><label for="threadTitleInput">대화 제목</label><input id="threadTitleInput" name="title" required maxlength="40" placeholder="예: 발표 자료 준비"></div><div class="form-field"><label for="threadMessageInput">첫 메시지 <span class="optional-label">선택</span></label><textarea id="threadMessageInput" name="message" placeholder="모둠 친구들에게 전할 내용을 적어 주세요."></textarea></div><div class="modal-actions"><button type="button" data-cancel>취소</button><button class="primary" type="submit">단체 대화 만들기</button></div>`,form=>{const title=String(form.get('title')||'').trim(),firstMessage=String(form.get('message')||'').trim();if(!title)return;const threadId=`thread-${Date.now()}`,now=Date.now(),thread={id:threadId,title,messages:[],createdAt:now,updatedAt:now};if(firstMessage)thread.messages.push({from:currentStudentId(),text:firstMessage,time:new Intl.DateTimeFormat('ko-KR',{hour:'numeric',minute:'2-digit'}).format(new Date())});getChatThreads(chatId).push(thread);openThread={chatId,threadId};save();closeModal();renderChat();notify('새 모둠 대화 스레드를 만들었어요.')});
  $('#modalForm [data-cancel]').addEventListener('click',closeModal);
}
function openNewPrivateThread(){
  const selectedId=data.selectedId,teacher=data.role==='teacher';
  if(isGroup(selectedId)||(!teacher&&selectedId!=='teacher'))return;
  const chatId=teacher?selectedId:currentStudentId(),personName=teacher?(student(selectedId)?.name||'학생'):'박서연 선생님';
  openModal('새 개인 대화',`<p class="modal-intro">${esc(personName)}님과 나눌 새 대화 스레드예요.</p><div class="form-field"><label for="threadTitleInput">대화 제목</label><input id="threadTitleInput" name="title" required maxlength="40" placeholder="예: 준비물 질문"></div><div class="form-field"><label for="threadMessageInput">첫 메시지 <span class="optional-label">선택</span></label><textarea id="threadMessageInput" name="message" placeholder="대화를 시작할 내용을 적어 주세요."></textarea></div><div class="modal-actions"><button type="button" data-cancel>취소</button><button class="primary" type="submit">대화 만들기</button></div>`,form=>{const title=String(form.get('title')||'').trim(),firstMessage=String(form.get('message')||'').trim();if(!title)return;const threadId=`thread-${Date.now()}`,now=Date.now(),thread={id:threadId,title,messages:[],createdAt:now,updatedAt:now};if(firstMessage)thread.messages.push({from:teacher?'teacher':currentStudentId(),text:firstMessage,time:new Intl.DateTimeFormat('ko-KR',{hour:'numeric',minute:'2-digit'}).format(new Date())});getChatThreads(chatId).push(thread);openThread={chatId:selectedId,threadId};save();closeModal();renderChat();notify('새 개인 대화 스레드를 만들었어요.')});

function openEventModal(){
  const today='2026-10-20';
  openModal('학생에게 일정 공지',`<div class="form-field"><label for="eventTitle">공지 제목</label><input id="eventTitle" name="title" required maxlength="40" placeholder="예: 과학 준비물 가져오기"></div><div class="form-field"><label for="eventDate">날짜</label><input id="eventDate" name="date" type="date" value="${today}" required></div><div class="form-field"><label for="eventDetail">안내 내용</label><textarea id="eventDetail" name="detail" placeholder="학생에게 전할 내용을 적어 주세요."></textarea></div><div class="modal-actions"><button type="button" data-cancel>취소</button><button class="primary" type="submit">공지 등록</button></div>`,form=>{const title=String(form.get('title')||'').trim();if(!title)return;data.events.push({id:`e${Date.now()}`,title,date:String(form.get('date')),detail:String(form.get('detail')||'').trim(),readBy:[]});save();closeModal();renderCalendar();$('#calendarDrawer').classList.add('open');notify('학급 캘린더에 일정을 등록했어요.')});
  $('#modalForm [data-cancel]').addEventListener('click',closeModal);

function openAnnouncementModal(){
  openModal('새 공지사항',`<div class="form-field"><label for="announcementTitle">공지 제목</label><input id="announcementTitle" name="title" required maxlength="60" placeholder="예: 수학 학습지 제출 안내"></div><div class="form-field"><label for="announcementContent">공지 내용</label><textarea id="announcementContent" name="content" required placeholder="학생들에게 전달할 내용을 적어 주세요."></textarea></div><label class="student-check"><input id="hasDeadline" name="hasDeadline" type="checkbox" value="yes">마감일이 있는 공지예요</label><div class="form-field"><label for="announcementDeadline">마감일</label><input id="announcementDeadline" name="deadlineAt" type="date" disabled></div><div class="modal-actions"><button type="button" data-cancel>취소</button><button class="primary" type="submit">공지 게시</button></div>`,form=>{const title=String(form.get('title')||'').trim(),content=String(form.get('content')||'').trim(),hasDeadline=form.get('hasDeadline')==='yes',deadlineAt=hasDeadline?String(form.get('deadlineAt')||''):'';if(!title||!content)return;if(hasDeadline&&!deadlineAt){notify('마감일을 선택해 주세요.');return}data.announcements.push({id:`a${Date.now()}`,title,content,postedAt:new Date().toISOString(),deadlineAt});save();closeModal();sidebarMode='announcements';render();notify('공지사항을 게시했어요.')});

function openAnnouncementDetail(id){

$('#teacherRole').addEventListener('click',()=>setRole('teacher'));$('#studentRole').addEventListener('click',()=>setRole('student'));
$('#classPicker').addEventListener('change',e=>{const next=e.target.value;data.classrooms[data.className]={students:data.students,groups:data.groups,studentId:data.studentId,studentName:data.studentName};const room=data.classrooms[next]||classPresets[next];data.className=next;data.students=room.students;data.groups=room.groups;data.studentId=room.studentId||room.students[0]?.id||'';data.studentName=room.studentName||student(data.studentId)?.name||data.studentName;data.selectedId=data.students[0]?.id||'';save();render();notify(`${data.className} 학생 목록을 불러왔어요.`)});

$('#messageForm').addEventListener('submit',e=>{e.preventDefault();sendMessage($('#messageInput').value)});

$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#threadListBack').addEventListener('click',()=>{openThread=null;renderChat()});$('#mobileBack').addEventListener('click',()=>{openThread=null;$('#shell').classList.remove('chat-open')});

render();if(innerWidth<=720)$('#shell').classList.add('chat-open');
