<script>
const $ = (selector) => document.querySelector(selector);
const storageKey = 'dajung-classroom-v1';
const palette = ['','coral','lilac','blue','yellow'];
const initialData = {
  role:'teacher', className:'5학년 2반', studentId:'s1', studentName:'김하늘', selectedId:'s1',
  students:[
    {id:'s1',name:'김하늘',color:0},{id:'s2',name:'이도윤',color:1},{id:'s3',name:'박민서',color:2},{id:'s4',name:'최유진',color:3},{id:'s5',name:'정시우',color:4},{id:'s6',name:'윤서아',color:2}
  ],
  groups:[{id:'g1',name:'별빛 모둠',members:['s1','s3','s5']},{id:'g2',name:'무지개 모둠',members:['s2','s4','s6']}],
  events:[
    {id:'e1',date:'2026-10-20',title:'과학 준비물 가져오기',detail:'돋보기와 관찰 노트를 챙겨 와요.',readBy:['s1','s2','s4']},
    {id:'e2',date:'2026-10-22',title:'책 읽는 날',detail:'함께 읽고 싶은 책 한 권을 가져와요.',readBy:['s1','s3','s5']},
    {id:'e3',date:'2026-10-26',title:'학급 발표회',detail:'모둠별 발표 순서를 확인해 주세요.',readBy:['s2']}
  ],
  announcements:[
    {id:'a1',title:'수학 학습지 제출 안내',content:'이번 주에 푼 학습지를 확인하고 제출해 주세요.',postedAt:'2026-10-17T08:30:00.000Z',deadlineAt:'2026-10-20'},
    {id:'a2',title:'도서관 책 반납 안내',content:'빌린 책을 도서관 반납함에 넣어 주세요.',postedAt:'2026-10-16T03:00:00.000Z',deadlineAt:''},
    {id:'a3',title:'아침 독서 준비',content:'읽고 싶은 책 한 권을 교실에 가져와 주세요.',postedAt:'2026-10-15T23:00:00.000Z',deadlineAt:'2026-10-21'}
  ],
  chats:{
    s1:[{from:'teacher',text:'하늘아, 오늘 발표 준비하느라 수고했어요! 궁금한 점 있으면 편하게 남겨 주세요.',time:'오전 9:18'},{from:'student',text:'감사합니다 선생님! 그림 자료는 내일 가져가도 될까요?',time:'오전 9:26'},{from:'teacher',text:'네, 내일까지 준비하면 충분해요. 친구들과 역할도 나눠 보세요 :)',time:'오전 9:30'}],
    s2:[{from:'teacher',text:'도윤아, 수학 문제 4번 풀이를 같이 확인해 봐요.',time:'오전 10:04'},{from:'student',text:'제가 계산한 방법을 사진 대신 글로 적어볼게요.',time:'오전 10:12'}],
    s3:[{from:'student',text:'민서야, 모둠 발표 제목은 어떤 게 좋을까?',time:'어제'}],
    s4:[{from:'teacher',text:'유진아, 준비물 안내를 확인해 주세요.',time:'어제'}],
    s5:[],s6:[],
    g1:[{from:'teacher',text:'별빛 모둠 친구들, 오늘은 발표 주제를 정하고 각자 맡을 일을 이야기해 봐요.',time:'오전 9:05'},{from:'s3',text:'저는 사진 자료를 찾아볼게요!',time:'오전 9:12'}],
    g2:[{from:'teacher',text:'무지개 모둠, 함께 정한 규칙을 발표 자료에 넣어 주세요.',time:'오전 8:50'}],
    'peer-s1-s3':[{from:'s3',text:'하늘아, 우리 발표 제목 같이 생각해 볼래?',time:'오전 9:42'}]
  }, unread:{s1:1,s3:1},
  peerNames:{'peer-s1-s3':'박민서'}
};
let data;
let openThread=null;
let openAnnouncementId=null;
let pendingFeedback=null;
let replyingTo=null;
let sidebarMode='chats';
try{data=JSON.parse(localStorage.getItem(storageKey))||initialData}catch{data=initialData}
data.announcements ||= initialData.announcements;
data.chatThreads ||= {};
Object.entries(data.chats||{}).forEach(([chatId,messages])=>{if(!data.chatThreads[chatId])data.chatThreads[chatId]=[{id:`main-${chatId}`,title:'기존 대화',messages:Array.isArray(messages)?messages:[],createdAt:0,updatedAt:0}]});
Object.entries(data.chatThreads).forEach(([chatId,threads])=>threads.forEach((thread,threadIndex)=>(thread.messages||[]).forEach((message,messageIndex)=>{message.id ||= `message-${chatId}-${threadIndex}-${messageIndex}`;message.annotations ||= []})));
const classPresets={
  '5학년 1반':{students:[{id:'a1',name:'강지우',color:0},{id:'a2',name:'문서준',color:1},{id:'a3',name:'배수아',color:2},{id:'a4',name:'신도현',color:3},{id:'a5',name:'오하린',color:4}],groups:[{id:'g51a',name:'햇살 모둠',members:['a1','a3','a5']},{id:'g51b',name:'구름 모둠',members:['a2','a4']}]},
  '4학년 3반':{students:[{id:'b1',name:'고은찬',color:0},{id:'b2',name:'김나율',color:1},{id:'b3',name:'남예준',color:2},{id:'b4',name:'도하윤',color:3},{id:'b5',name:'유채원',color:4}],groups:[{id:'g43a',name:'초록 모둠',members:['b1','b2','b3']},{id:'g43b',name:'바다 모둠',members:['b4','b5']}]}
};
data.classrooms ||= {};
const demoReadStatus={e1:['s1','s2','s4'],e2:['s1','s3','s5'],e3:['s2']};
data.events.forEach(event=>{if(!Array.isArray(event.readBy)||(!event.readBy.length&&demoReadStatus[event.id]))event.readBy=demoReadStatus[event.id]||[]});
function save(){localStorage.setItem(storageKey,JSON.stringify(data))}
save();
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function student(id){return data.students.find(p=>p.id===id)}
if(!student(data.studentId))data.studentId=data.students[0]?.id||'';
if(student(data.studentId))data.studentName=student(data.studentId).name;
function currentStudentId(){return data.students.some(p=>p.id===data.studentId)?data.studentId:(data.students[0]?.id||'s1')}
function group(id){return data.groups.find(p=>p.id===id)}
function currentStudentGroups(){return data.groups.filter(g=>g.members.includes(currentStudentId()))}
function studentCanOpenConversation(id){return id==='teacher'||(isGroup(id)&&currentStudentGroups().some(g=>g.id===id))}
function isGroup(id){return id.startsWith('g')}
function selectedPeerChat(id){return id.startsWith('peer-')}
function initials(name){return (name||'?').slice(0,1)}
function avatar(name,color=0,extra=''){return `<span class="person-avatar ${palette[color]||''} ${extra}">${esc(initials(name))}</span>`}
function getChatName(id){if(id==='teacher')return '박서연 선생님';if(isGroup(id))return group(id)?.name||'모둠';if(selectedPeerChat(id))return data.peerNames[id]||'친구';return student(id)?.name||'학생'}
function getChatThreads(id){if(!data.chatThreads[id])data.chatThreads[id]=[{id:`main-${id}`,title:'기존 대화',messages:data.chats[id]||[],createdAt:0,updatedAt:0}];return data.chatThreads[id]}
function getLatestThread(id){return [...getChatThreads(id)].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))[0]}
function getLast(id){const thread=getLatestThread(id),message=thread?.messages?.at(-1);return message?.text||(thread?`새 대화: ${thread.title}`:'새로운 대화를 시작해 보세요')}
function getTime(id){const thread=getLatestThread(id);return thread?.messages?.at(-1)?.time||''}
function setRole(role){data.role=role;openThread=null;openAnnouncementId=null;pendingFeedback=null;replyingTo=null;if(role==='student'){data.studentId=currentStudentId();data.studentName=student(data.studentId)?.name||data.studentName;data.selectedId='teacher'}else if(data.selectedId==='teacher'||selectedPeerChat(data.selectedId))data.selectedId=data.students[0]?.id||'';save();render()}
function render(){
  const teacher=data.role==='teacher';
  $('#teacherRole').classList.toggle('active',teacher);$('#studentRole').classList.toggle('active',!teacher);
  $('#chatNav').classList.toggle('selected',sidebarMode==='chats');$('#announcementNav').classList.toggle('selected',sidebarMode==='announcements');

$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#threadListBack').addEventListener('click',()=>{openThread=null;openAnnouncementId=null;pendingFeedback=null;replyingTo=null;renderChat()});$('#mobileBack').addEventListener('click',()=>{openThread=null;openAnnouncementId=null;pendingFeedback=null;replyingTo=null;$('#shell').classList.remove('chat-open')});
$('#chatNav').addEventListener('click',()=>{sidebarMode='chats';openThread=null;openAnnouncementId=null;if(innerWidth<=720)$('#shell').classList.remove('chat-open');$('#calendarDrawer').classList.remove('open');$('#calendarToggle').classList.remove('selected');render()});
render();if(innerWidth<=720)$('#shell').classList.add('chat-open');
</script>
